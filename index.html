<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>かんたん翻訳</title>
<style>
  :root{--bg:#f4f6fb;--card:#fff;--text:#1f2937;--sub:#6b7280;--line:#d7dce5;--accent:#2563eb;--accent2:#1d4ed8}
  @media (prefers-color-scheme:dark){:root{--bg:#111827;--card:#1f2937;--text:#f3f4f6;--sub:#9ca3af;--line:#374151;--accent:#3b82f6;--accent2:#2563eb}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif}
  header{padding:14px 20px;font-size:20px;font-weight:700}
  main{max-width:1200px;margin:0 auto;padding:0 16px 32px}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:760px){.grid{grid-template-columns:1fr}}
  .pane{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
  .head{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .head select{flex:1;min-width:120px}
  select,button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;padding:8px 18px}
  button.primary:hover{background:var(--accent2)}
  .wrap{position:relative}
  textarea,.bd{font-size:18px;line-height:1.55;padding:10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;letter-spacing:normal}
  textarea{display:block;position:relative;z-index:1;width:100%;height:260px;min-height:100px;resize:both;max-width:100%;color:var(--text);background:transparent}
  .bd{position:absolute;left:0;top:0;z-index:0;overflow:hidden;color:transparent;border-color:transparent;pointer-events:none;margin:0}
  .bd mark{color:transparent;background:rgba(250,204,21,.38);border-radius:3px}
  .bd mark.s{background:rgba(249,115,22,.62)}
  textarea.plain{height:110px;font-size:16px}
  #paneN,#palette{margin-top:14px}
  .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .gl{font-size:12px;color:var(--sub);min-width:5.5em}
  .chip{font-size:13px;padding:4px 10px}
  .chip.neg{border-color:#f87171}
  #cands{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
  .chip.sd{border-color:var(--accent)}
  #hint{min-height:1.6em;margin-top:10px;font-size:15px;color:var(--text)}
  #hint .sub{color:var(--sub);font-size:13px}
  textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .tools .sp{flex:1}
  .cnt{color:var(--sub);font-size:13px}
  .lbl{font-size:12px;color:var(--sub)}
  #status{color:var(--sub);font-size:13px;min-height:1.2em}
  #status.err{color:#dc2626}
  label.chk{display:flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<header>🌐 かんたん翻訳</header>
<main>
  <div class="bar">
    <button class="primary" id="go">翻訳する (Ctrl+Enter)</button>
    <button id="swap" title="言語と内容を入れ替え">⇄ 入れ替え</button>
    <label class="chk"><input type="checkbox" id="auto"> 入力しながら自動翻訳</label>
    <label class="chk" title="(重み:1.2) [ ] <lora:…> BREAK を壊さず、カンマごとのタグ単位で翻訳します"><input type="checkbox" id="sd"> SDプロンプトモード</label>
    <span id="status"></span>
  </div>

  <div class="grid">
    <!-- 左 -->
    <section class="pane" id="paneL">
      <div class="head"><select id="langL"></select></div>
      <div class="wrap"><div class="bd" id="bdL"></div><textarea id="boxL" placeholder="ここに入力・貼り付け" spellcheck="false"></textarea></div>
      <div class="tools">
        <button data-act="paste" data-s="L">📋 貼り付け</button>
        <button data-act="copy" data-s="L">コピー</button>
        <button data-act="clear" data-s="L">消去</button>
        <span class="sp"></span>
        <span class="lbl">文字</span>
        <button data-act="fs-" data-s="L">A−</button><button data-act="fs+" data-s="L">A＋</button>
        <span class="lbl">高さ</span>
        <button data-act="h-" data-s="L">−</button><button data-act="h+" data-s="L">＋</button>
        <span class="lbl">重み</span><button data-act="w-" data-s="L" title="選択部分の重みを下げる (Ctrl+↓)">−0.1</button><button data-act="w+" data-s="L" title="選択部分の重みを上げる (Ctrl+↑)">+0.1</button>
        <span class="cnt" id="cntL">0文字</span>
      </div>
    </section>
    <!-- 右 -->
    <section class="pane" id="paneR">
      <div class="head"><select id="langR"></select></div>
      <div class="wrap"><div class="bd" id="bdR"></div><textarea id="boxR" placeholder="翻訳結果（ここも編集・貼り付けできます）" spellcheck="false"></textarea></div>
      <div class="tools">
        <button data-act="paste" data-s="R">📋 貼り付け</button>
        <button data-act="copy" data-s="R">コピー</button>
        <button data-act="clear" data-s="R">消去</button>
        <button data-act="rev" data-s="R" title="右の文章を左の言語へ翻訳">← 左へ翻訳</button>
        <span class="sp"></span>
        <span class="lbl">文字</span>
        <button data-act="fs-" data-s="R">A−</button><button data-act="fs+" data-s="R">A＋</button>
        <span class="lbl">高さ</span>
        <button data-act="h-" data-s="R">−</button><button data-act="h+" data-s="R">＋</button>
        <span class="lbl">重み</span><button data-act="w-" data-s="R" title="選択部分の重みを下げる (Ctrl+↓)">−0.1</button><button data-act="w+" data-s="R" title="選択部分の重みを上げる (Ctrl+↑)">+0.1</button>
        <span class="cnt" id="cntR">0文字</span>
      </div>
    </section>
  </div>
  <div id="hint">文字をドラッグ（選択）すると、反対側の対応する部分が黄色で光ります。</div>
  <div id="cands"></div>

  <section class="pane" id="paneN">
    <div class="head"><b>ネガティブプロンプト</b><span class="lbl">入れたくない要素。日本語で書いて英語に翻訳もできます</span></div>
    <textarea id="boxN" class="plain" placeholder="例: lowres, bad hands, 低品質, 透かし …" spellcheck="false"></textarea>
    <div class="tools">
      <button data-act="paste" data-s="N">📋 貼り付け</button>
      <button data-act="copy" data-s="N">コピー</button>
      <button data-act="clear" data-s="N">消去</button>
      <button data-act="ntr" data-s="N">→ 右の言語へ翻訳</button>
      <button data-act="nundo" data-s="N">元に戻す</button>
      <span class="lbl">重み</span>
      <button data-act="w-" data-s="N">−0.1</button><button data-act="w+" data-s="N">+0.1</button>
      <span class="sp"></span><span class="cnt" id="cntN">0文字</span>
    </div>
  </section>

  <section class="pane" id="palette">
    <div class="head"><b>定番タグ</b><span class="lbl" id="insTo">押すと、最後にカーソルを置いた枠（左/右）に追加。ネガティブ用は下の枠へ。</span></div>
    <div id="chips"></div>
  </section>
</main>

<script>
const LANGS = [["ja","日本語"],["en","英語"],["zh-CN","中国語(簡体)"],["zh-TW","中国語(繁体)"],["ko","韓国語"],["es","スペイン語"],["fr","フランス語"],["de","ドイツ語"],["it","イタリア語"],["pt","ポルトガル語"],["ru","ロシア語"],["vi","ベトナム語"],["th","タイ語"],["id","インドネシア語"],["tl","フィリピノ語"],["hi","ヒンディー語"],["ar","アラビア語"],["tr","トルコ語"],["nl","オランダ語"],["pl","ポーランド語"],["uk","ウクライナ語"],["sv","スウェーデン語"]];
const $ = id => document.getElementById(id);
const box = {L:$("boxL"), R:$("boxR")}, lang = {L:$("langL"), R:$("langR")}, cnt = {L:$("cntL"), R:$("cntR")};
const status = $("status");
const bd = {L:$("bdL"), R:$("bdR")};
box.N = $("boxN"); cnt.N = $("cntN");
let detectedLang = null;
let map = null, hl = {L:null, R:null};   // map: 対応表 [{L:[a,b],R:[c,d]}] / hl: ハイライト範囲

// 言語セレクト（左だけ自動検出あり）
function fill(sel, withAuto){
  sel.innerHTML = (withAuto ? '<option value="auto">言語を自動検出</option>' : "") +
    LANGS.map(([c,n]) => `<option value="${c}">${n}</option>`).join("");
}
fill(lang.L, true); fill(lang.R, false);

// 設定の保存・復元
const S = {fsL:18, fsR:18, hL:260, hR:260, sl:"auto", tl:"ja", auto:false, sd:true};
try{ Object.assign(S, JSON.parse(localStorage.getItem("trans-settings")||"{}")); }catch(e){}
const save = () => { try{ localStorage.setItem("trans-settings", JSON.stringify(S)); }catch(e){} };
function apply(){
  for(const s of ["L","R"]){ box[s].style.fontSize = S["fs"+s]+"px"; box[s].style.height = S["h"+s]+"px"; }
  lang.L.value = S.sl; lang.R.value = S.tl; $("auto").checked = S.auto; $("sd").checked = S.sd;
  renderBoth();
}


// ---- ハイライト用の背面レイヤー ----
const esc = t => t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function sync(s){
  const ta=box[s], d=bd[s];
  d.style.width=ta.offsetWidth+"px"; d.style.height=ta.offsetHeight+"px";
  d.style.fontSize=ta.style.fontSize;
  d.style.paddingRight=(10+ta.offsetWidth-ta.clientWidth-2)+"px";
  d.scrollTop=ta.scrollTop;
}
function renderBd(s){
  const t=box[s].value, h=hl[s]; let html;
  if(!h) html=esc(t);
  else{
    const [a,b]=h.light, st=h.strong;
    html=esc(t.slice(0,a))+'<mark>';
    if(st && st[0]>=a && st[1]<=b) html+=esc(t.slice(a,st[0]))+'<mark class="s">'+esc(t.slice(st[0],st[1]))+'</mark>'+esc(t.slice(st[1],b));
    else html+=esc(t.slice(a,b));
    html+='</mark>'+esc(t.slice(b));
  }
  bd[s].innerHTML=html+"\u200b"; sync(s);
}
function renderBoth(){ renderBd("L"); renderBd("R"); }
function invalidate(){ map=null; hl={L:null,R:null}; $("hint").innerHTML=""; $("cands").innerHTML=""; renderBoth(); }
["L","R"].forEach(s => {
  new ResizeObserver(() => sync(s)).observe(box[s]);
  box[s].addEventListener("scroll", () => { bd[s].scrollTop=box[s].scrollTop; });
  box[s].addEventListener("mouseup", () => { S["h"+s]=Math.round(box[s].getBoundingClientRect().height); save(); });
});

function setStatus(t, err){ status.textContent = t||""; status.className = err ? "err" : ""; }
// CLIPトークンの目安（重み・括弧・LoRAタグは数えず、BREAKごとの最大値）
function tokEst(text){
  let best=0;
  for(const ch of text.split(/\bBREAK\b/)){
    const t=ch.replace(/<[^>]*>/g," ").replace(/:\s*-?\d*\.?\d+(?=\s*[)\]])/g,"").replace(/[()\[\]{}]/g," ");
    let n=0; for(const w of (t.match(/[A-Za-z0-9']+|[^\sA-Za-z0-9']/g)||[])) n += /^[A-Za-z0-9']+$/.test(w) ? Math.max(1,Math.ceil(w.length/7)) : 1;
    best=Math.max(best,n);
  }
  return best;
}
function count(s){
  const v=box[s].value; let h=v.length.toLocaleString()+"文字", warn=false;
  if(v && (v.match(/[\x00-\x7F]/g)||[]).length/v.length>0.7){ const n=tokEst(v); h+=" ・約"+n+"/75トークン"; warn=n>75; }
  cnt[s].textContent=h; cnt[s].style.color=warn?"#dc2626":"";
}
["L","R"].forEach(s => box[s].addEventListener("input", () => { count(s); invalidate(); if(s==="L") schedule(); }));
box.N.addEventListener("input", () => count("N"));

// ---- 翻訳本体 ----
// 文・読点ごとに分割（対応づけの単位）
function segmentize(text){
  const STRONG="。．!?！？", WEAK="、，,;；:：", CLOSE="」』）)\"'”’";
  const out=[]; let st=0;
  for(let i=0;i<text.length;i++){
    const c=text[i], nx=text[i+1];
    const strong = STRONG.includes(c) || (c==="." && (nx===undefined||/\s/.test(nx))) || c==="\n";
    const weak = WEAK.includes(c) && i+1-st>=12;
    if(!strong && !weak) continue;
    let e=i+1;
    while(e<text.length && (CLOSE.includes(text[e]) || /\s/.test(text[e]))) e++;
    out.push([st,e]); st=e; i=e-1;
  }
  if(st<text.length) out.push([st,text.length]);
  return out;
}
async function pool(items, n, fn){
  const res=new Array(items.length); let i=0;
  await Promise.all(Array.from({length:Math.min(n,items.length)}, async()=>{ while(i<items.length){ const k=i++; res[k]=await fn(items[k],k); } }));
  return res;
}
async function viaGoogle(q, sl, tl){
  const r = await fetch("https://translate.googleapis.com/translate_a/single", {
    method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"client=gtx&dt=t&sl="+encodeURIComponent(sl)+"&tl="+encodeURIComponent(tl)+"&q="+encodeURIComponent(q)
  });
  if(!r.ok) throw new Error("HTTP "+r.status);
  const j = await r.json();
  return {text:j[0].map(x=>x[0]).join(""), detected:j[2]};
}
async function viaMyMemory(q, sl, tl){
  const src = sl==="auto" ? "Autodetect" : sl;
  const r = await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(q)+"&langpair="+encodeURIComponent(src+"|"+tl));
  const j = await r.json();
  if(j.responseStatus!==200) throw new Error(j.responseDetails||"翻訳失敗");
  return {text:j.responseData.translatedText, detected:null};
}
// Googleの別訳・辞書候補つき翻訳（短い語句用）
const selCache = new Map();
async function getAlts(q, sl, tl){
  const key=sl+"|"+tl+"|"+q; if(selCache.has(key)) return selCache.get(key);
  let res;
  try{
    const r = await fetch("https://translate.googleapis.com/translate_a/single", {
      method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:"client=gtx&dt=t&dt=at&dt=bd&sl="+encodeURIComponent(sl)+"&tl="+encodeURIComponent(tl)+"&q="+encodeURIComponent(q)
    });
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json(), alts=[];
    (j[5]||[]).forEach(x => (x[2]||[]).forEach(y => alts.push(y[0])));
    (j[1]||[]).forEach(x => (x[1]||[]).forEach(y => alts.push(y)));
    res = {text:j[0].map(x=>x[0]).join(""), alts};
  }catch(e){ res = {...(await viaMyMemory(q, sl, tl)), alts:[]}; }
  selCache.set(key,res); return res;
}
async function one(p, sl, tl){
  try{ return await viaGoogle(p, sl, tl); }
  catch(e){ return await viaMyMemory(p.slice(0,450), sl, tl); }
}
const hw = t => t.replace(/（/g,"(").replace(/）/g,")").replace(/［/g,"[").replace(/］/g,"]").replace(/｛/g,"{").replace(/｝/g,"}").replace(/：/g,":");
// SDモード: カンマ・改行ごとに分割
function sdSegmentize(text){
  const out=[]; let st=0;
  for(let i=0;i<text.length;i++){
    const c=text[i]; if(!",、，\n".includes(c)) continue;
    let e=i+1; while(e<text.length && /[ \t　]/.test(text[e])) e++;
    if(c==="\n") while(e<text.length && /\s/.test(text[e])) e++;
    out.push([st,e]); st=e; i=e-1;
  }
  if(st<text.length) out.push([st,text.length]);
  return out;
}
// 1タグを「前の括弧 / 翻訳する本文 / 重み・閉じ括弧・区切り」に分ける
function splitSD(piece){
  const lead=piece.match(/^[\s(（\[［{｛]*/)[0]; let rest=piece.slice(lead.length);
  const sep=rest.match(/[,、，]?\s*$/)[0]; rest=rest.slice(0,rest.length-sep.length);
  const CL=/[\s)）\]］}｝]*$/;
  const cl1=rest.match(CL)[0]; rest=rest.slice(0,rest.length-cl1.length);
  const wm=rest.match(/[:：]\s*-?\d*\.?\d+$/), wt=wm?wm[0]:""; rest=rest.slice(0,rest.length-wt.length);
  const cl2=rest.match(CL)[0]; rest=rest.slice(0,rest.length-cl2.length);
  const t=rest.trim();
  return {lead, core:rest, trail:cl2+wt+cl1+sep, skip: !t || /^<.*>$/.test(t) || /^BREAK$/i.test(t) || /^[\d.\s]+$/.test(t)};
}
async function translate(text, sl, tl, sd){
  const pieces = (sd ? sdSegmentize : segmentize)(text);
  const cjk = /^(ja|zh|th)/.test(tl);
  const parts = pieces.map(([a,b]) => {
    const p=text.slice(a,b);
    if(sd) return {a, ...splitSD(p)};
    const m=p.match(/^(\s*)([\s\S]*?)(\s*)$/); return {a, lead:m[1], core:m[2], trail:m[3], skip:false};
  });
  const rs = await pool(parts, 4, p => (p.core.trim() && !p.skip) ? one(p.core.trim(), sl, tl) : null);
  let tgt="", segs=[], detected=null;
  parts.forEach((p, k) => {
    if(!p.core.trim()){ tgt += p.lead+p.trail; return; }
    let t;
    if(p.skip) t=p.core;
    else{
      t=rs[k].text.trim(); detected = detected || rs[k].detected;
      if(sd){ t=t.replace(/[。．.]+$/,""); if(tl==="en") t=t.toLowerCase(); }
    }
    let lead=p.lead, trail=p.trail;
    if(sd && !cjk){ lead=hw(lead); trail=hw(trail).replace(/[、，]\s*/g,", "); }
    tgt+=lead; const c=tgt.length; tgt+=t;
    segs.push({src:[p.a+p.lead.length, p.a+p.lead.length+p.core.length], tgt:[c, tgt.length]});
    if(sd) tgt+=trail;
    else tgt += k===parts.length-1 ? trail : (/\n/.test(trail) ? trail : (cjk ? "" : " "));
  });
  return {text:tgt, detected, segs};
}

let seq = 0, timer;
async function run(from){           // from: "L"→右へ / "R"→左へ
  const to = from==="L" ? "R" : "L";
  const text = box[from].value;
  if(!text.trim()){ box[to].value=""; count(to); invalidate(); setStatus(""); return; }
  const sl = from==="L" ? lang.L.value : lang.R.value;
  const tl = to==="R" ? lang.R.value : (lang.L.value==="auto" ? (detectedLang||"en") : lang.L.value);
  const my = ++seq; setStatus("翻訳中…");
  try{
    const r = await translate(text, sl, tl, S.sd);
    if(my!==seq) return;
    box[to].value = r.text; count(to);
    map = {segs: r.segs.map(g => from==="L" ? {L:g.src, R:g.tgt} : {R:g.src, L:g.tgt})};
    hl = {L:null, R:null}; $("hint").innerHTML=""; renderBoth();
    if(from==="L" && sl==="auto" && r.detected) detectedLang = r.detected;
    const n = r.detected && sl==="auto" ? (LANGS.find(l=>l[0]===r.detected)||[,r.detected])[1] : "";
    setStatus(n ? "検出した言語: "+n : "完了");
  }catch(e){ if(my===seq) setStatus("翻訳できませんでした（ネット接続を確認してください）", true); }
}
function schedule(){ if(!S.auto) return; clearTimeout(timer); timer=setTimeout(()=>run("L"), 700); }

$("go").onclick = () => run("L");
$("auto").onchange = e => { S.auto=e.target.checked; save(); };
lang.L.onchange = () => { S.sl=lang.L.value; save(); if(box.L.value.trim()) run("L"); };
lang.R.onchange = () => { S.tl=lang.R.value; save(); if(box.L.value.trim()) run("L"); };
document.addEventListener("keydown", e => { if((e.ctrlKey||e.metaKey) && e.key==="Enter") run(document.activeElement===box.R ? "R" : "L"); });

$("swap").onclick = () => {
  const sl = lang.L.value==="auto" ? (detectedLang||"en") : lang.L.value, tl = lang.R.value;
  lang.L.value = tl; lang.R.value = sl; S.sl=tl; S.tl=sl; save();
  const t = box.L.value; box.L.value = box.R.value; box.R.value = t; count("L"); count("R");
  if(map) map.segs = map.segs.map(g => ({L:g.R, R:g.L}));
  hl = {L:null, R:null}; $("hint").innerHTML=""; renderBoth();
};

// ---- コピー・貼り付け・サイズ変更（左右共通）----
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); }
  catch(e){ const a=document.createElement("textarea"); a.value=t; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); }
}
document.addEventListener("click", async e => {
  const b = e.target.closest("button[data-act]"); if(!b) return;
  const s = b.dataset.s, a = b.dataset.act, el = box[s];
  if(s==="N"){ negAct(a); return; }
  if(a==="copy"){ await copyText(el.value); setStatus("コピーしました"); }
  else if(a==="paste"){
    try{ const t = await navigator.clipboard.readText(); el.value = t; count(s); invalidate(); if(s==="L") schedule(); setStatus("貼り付けました"); }
    catch(err){ el.focus(); setStatus("ブラウザが許可しない場合は Ctrl+V（Macは⌘+V）で貼り付けてください", true); }
  }
  else if(a==="clear"){ el.value=""; count(s); invalidate(); el.focus(); }
  else if(a==="rev"){ run("R"); }
  else if(a==="w+"||a==="w-"){ adjustWeight(s, a==="w+" ? 0.1 : -0.1); }
  else if(a==="fs+"||a==="fs-"){ S["fs"+s]=Math.min(60,Math.max(10,S["fs"+s]+(a==="fs+"?2:-2))); el.style.fontSize=S["fs"+s]+"px"; sync(s); save(); }
  else if(a==="h+"||a==="h-"){ S["h"+s]=Math.min(1200,Math.max(100,Math.round(el.getBoundingClientRect().height)+(a==="h+"?80:-80))); el.style.height=S["h"+s]+"px"; save(); }
});

// ---- ドラッグ選択 → 反対側の対応箇所を光らせる ----
let selTimer, selTok=0;
function clearHl(){ $("cands").innerHTML=""; if(hl.L||hl.R){ hl={L:null,R:null}; $("hint").innerHTML=""; renderBoth(); } }
function selRun(s){
  const el=box[s], a=el.selectionStart, b=el.selectionEnd, o=s==="L"?"R":"L", tok=++selTok;
  clearTimeout(selTimer);
  if(!map || a===b){ clearHl(); return; }
  const ov = map.segs.filter(g => a<g[s][1] && b>g[s][0]);
  if(!ov.length){ clearHl(); return; }
  const last=ov[ov.length-1];
  hl = {[s]:{light:[ov[0][s][0], last[s][1]]}, [o]:{light:[ov[0][o][0], last[o][1]]}};
  renderBoth();
  const picked = el.value.slice(a,b).trim();
  if(ov.length>1 || !picked || picked.length>120){ $("hint").innerHTML='<span class="sub">対応する文を表示中（短い範囲を選ぶと単語単位で分かります）</span>'; return; }
  const seg=ov[0];
  $("hint").innerHTML='<span class="sub">対応する文を表示中…</span>';
  selTimer=setTimeout(async () => {
    const sl=lang[s].value, tl=o==="R" ? lang.R.value : (lang.L.value==="auto" ? (detectedLang||"en") : lang.L.value);
    let r;
    try{ r = await getAlts(picked, sl, tl); }
    catch(e){ return; }
    const t=r.text.trim();
    if(tok!==selTok) return;
    const segO=box[o].value.slice(seg[o][0], seg[o][1]);
    const needle=t.replace(/[。．.!?！？、，,]+$/,"").toLowerCase();
    const idx = needle ? segO.toLowerCase().indexOf(needle) : -1;
    if(idx>=0){
      hl[o].strong=[seg[o][0]+idx, seg[o][0]+idx+needle.length];
      hl[s].strong=[a,b];
      renderBoth();
    }
    $("hint").innerHTML=`「${esc(picked)}」 → <b>「${esc(t)}」</b>` + (idx>=0 ? "" : ' <span class="sub">（文中の正確な位置は特定できないため、対応する文全体を表示しています）</span>');
    // 右側（出力側）の言い換え候補
    if(idx>=0){
      let cr=r, phrase=picked, csl=sl, ctl=tl;
      if(s==="R"){
        phrase=box.L.value.slice(hl.L.strong[0], hl.L.strong[1]); csl=lang.L.value; ctl=lang.R.value;
        try{ cr = await getAlts(phrase, csl, ctl); }catch(e){ return; }
        if(tok!==selTok) return;
      }
      showCands(seg, cr, phrase);
    } else $("cands").innerHTML="";
  }, 250);
}
["L","R"].forEach(s => ["select","mouseup","keyup","touchend","selectionchange"].forEach(ev =>
  box[s].addEventListener(ev, () => requestAnimationFrame(() => selRun(s)))));

// ---- 重み調整 ( ) と :1.1 ----
function adjustWeight(s, d){
  const el=box[s], v=el.value; let a=el.selectionStart, b=el.selectionEnd;
  if(a===b){            // 選択がなければカーソル位置のタグ（カンマ区切り）を対象に
    let ts=a>0 ? v.lastIndexOf(",", a-1)+1 : 0, te=v.indexOf(",", a); if(te<0) te=v.length;
    while(ts<te && v[ts]===" ") ts++; while(te>ts && v[te-1]===" ") te--;
    a=ts; b=te;
  }
  if(a>=b) return;
  let inner, w=1, from=a, to=b;
  const sel=v.slice(a,b), m2=sel.match(/^\(([\s\S]*?)[:：]\s*(-?\d*\.?\d+)\)$/), mm=v.slice(b).match(/^\s*[:：]\s*(-?\d*\.?\d+)\)/);
  if(m2){ inner=m2[1]; w=parseFloat(m2[2]); }
  else if(v[a-1]==="(" && mm){ inner=sel; w=parseFloat(mm[1]); from=a-1; to=b+mm[0].length; }
  else inner=sel;
  inner=inner.trim(); w=Math.max(0.1, Math.round((w+d)*100)/100);
  const out = Math.abs(w-1)<0.001 ? inner : "("+inner+":"+w+")";
  el.setRangeText(out, from, to, "select"); el.focus();
  count(s); if(s!=="N") invalidate();
}
["L","R","N"].forEach(s => box[s].addEventListener("keydown", e => {
  if((e.ctrlKey||e.metaKey) && (e.key==="ArrowUp"||e.key==="ArrowDown")){ e.preventDefault(); adjustWeight(s, e.key==="ArrowUp" ? 0.1 : -0.1); }
}));

// ---- ネガティブ欄 ----
let negBackup=null;
async function negAct(a){
  const el=box.N;
  if(a==="copy"){ await copyText(el.value); setStatus("コピーしました"); }
  else if(a==="paste"){ try{ el.value=await navigator.clipboard.readText(); count("N"); setStatus("貼り付けました"); }catch(e){ el.focus(); setStatus("Ctrl+V（Macは⌘+V）で貼り付けてください", true); } }
  else if(a==="clear"){ el.value=""; count("N"); el.focus(); }
  else if(a==="w+"||a==="w-"){ adjustWeight("N", a==="w+" ? 0.1 : -0.1); }
  else if(a==="nundo"){ if(negBackup!==null){ el.value=negBackup; negBackup=null; count("N"); } }
  else if(a==="ntr"){
    if(!el.value.trim()) return;
    negBackup=el.value; setStatus("翻訳中…");
    try{ const r=await translate(el.value, "auto", lang.R.value, true); el.value=r.text; count("N"); setStatus("ネガティブを翻訳しました（「元に戻す」で戻せます）"); }
    catch(e){ setStatus("翻訳できませんでした（ネット接続を確認してください）", true); }
  }
}

// ---- 定番タグ ----
const PRESETS=[

 {g:"画風", items:[["写真風","photorealistic, realistic"],["アニメ風","anime style"],["イラスト","illustration"],["水彩","watercolor"]]},
 {g:"光・カメラ", items:[["映画的な光","cinematic lighting"],["柔らかい光","soft lighting"],["背景ぼかし","depth of field, bokeh"],["逆光","backlighting"]]},
 {g:"構図", items:[["バストアップ","upper body"],["全身","full body"],["顔アップ","close-up"],["俯瞰","from above"],["あおり","from below"],["カメラ目線","looking at viewer"]]},
 {g:"ネガティブ用", neg:true, items:[["定番セット","lowres, bad anatomy, bad hands, text, error, missing fingers, extra digit, fewer digits, cropped, worst quality, low quality, normal quality, jpeg artifacts, signature, watermark, username, blurry"],["低品質(重み付き)","(worst quality, low quality:1.4)"],["崩れ防止","deformed, disfigured, mutated hands, extra limbs, extra fingers, poorly drawn face"],["文字・透かし","text, watermark, signature, logo"]]}
];
let insTarget="R";
["L","R"].forEach(s => box[s].addEventListener("focus", () => { insTarget=s; }));
function insertTags(s, text){
  const el=box[s], v=el.value, a=el.selectionStart, b=el.selectionEnd;
  const before=v.slice(0,a).replace(/\s+$/,""), after=v.slice(b).replace(/^[\s,]+/,"");
  const head = before + (before ? (before.endsWith(",") ? " " : ", ") : "") + text;
  el.value = head + (after ? ", "+after : "");
  el.focus(); el.setSelectionRange(head.length, head.length);
  count(s); if(s!=="N") invalidate();
  setStatus((s==="L"?"左":s==="R"?"右":"ネガティブ")+"の枠に追加しました");
}
$("chips").innerHTML = "";
PRESETS.forEach(g => {
  const row=document.createElement("div"); row.className="grp"; row.style.marginTop="6px";
  row.innerHTML='<span class="gl">'+g.g+'</span>';
  g.items.forEach(([label,text]) => {
    const b=document.createElement("button"); b.className="chip"+(g.neg?" neg":""); b.textContent=label; b.title=text;
    b.onclick=() => insertTags(g.neg ? "N" : insTarget, text);
    row.appendChild(b);
  });
  $("chips").appendChild(row);
});

$("sd").onchange = e => { S.sd=e.target.checked; save(); };

// ---- 言い換え候補 ----
const GLOSS=[
 ["悪い手",["bad hands","mutated hands","malformed hands"]],["手",["hands","hand"]],["指",["fingers","finger"]],
 ["余分な指",["extra fingers","extra digit"]],["指が欠けている",["missing fingers"]],["余分な手足",["extra limbs"]],
 ["傑作",["masterpiece"]],["最高品質",["best quality"]],["高品質",["high quality","best quality"]],["低品質",["low quality","worst quality"]],
 ["最低品質",["worst quality"]],["高解像度",["highres","high resolution"]],["低解像度",["lowres"]],["超詳細",["ultra detailed","extremely detailed"]],
 ["透かし",["watermark"]],["署名",["signature"]],["ロゴ",["logo"]],["文字",["text"]],["ぼやけた",["blurry"]],["ぼかし",["blur","bokeh"]],
 ["背景ぼかし",["depth of field","bokeh"]],["解剖学的に誤り",["bad anatomy"]],["変形",["deformed","disfigured"]],["醜い",["ugly"]],
 ["切り取られた",["cropped"]],["重複",["duplicate"]],["JPEGノイズ",["jpeg artifacts"]],
 ["青い目",["blue eyes"]],["長い髪",["long hair"]],["短い髪",["short hair"]],["笑顔",["smile","smiling"]],
 ["女の子",["1girl","girl"]],["男の子",["1boy","boy"]],["美しい",["beautiful"]],["可愛い",["cute"]],
 ["全身",["full body"]],["上半身",["upper body"]],["顔アップ",["close-up","portrait"]],["顔",["face"]],["目",["eyes"]],["髪",["hair"]],
 ["制服",["school uniform"]],["着物",["kimono"]],["桜",["cherry blossoms"]],["夕焼け",["sunset"]],["夜",["night"]],
 ["逆光",["backlighting"]],["映画的な照明",["cinematic lighting"]],["写真のようにリアル",["photorealistic"]],["アニメ風",["anime style"]],
 ["水彩",["watercolor"]],["油絵",["oil painting"]],["カメラ目線",["looking at viewer"]],["俯瞰",["from above"]],["あおり",["from below"]],
 ["横顔",["profile","from side"]],["背景",["background"]],["白背景",["white background"]],["単色背景",["simple background"]]
];
function glossCands(phrase){
  if(lang.R.value!=="en") return [];
  const hit=GLOSS.filter(([ja]) => phrase.includes(ja) || (phrase.length>=2 && ja.includes(phrase)));
  hit.sort((a,b) => (b[0]===phrase)-(a[0]===phrase) || b[0].length-a[0].length);
  const top=hit.length ? hit[0][0].length : 0;   // 一番長く一致した語だけ使う（「悪い手」で「手」を出さない）
  return hit.filter(([ja]) => ja.length===top).flatMap(([,en]) => en);
}
let candSeg=null;
function showCands(seg, r, phrase){
  candSeg=seg;
  const seen=new Set(), list=[], en=lang.R.value==="en";
  const add=(t,sd) => { t=(t||"").trim().replace(/[。．.!?！？]+$/,""); if(en) t=t.toLowerCase(); const k=t.toLowerCase(); if(!t||seen.has(k)) return; seen.add(k); list.push([t,sd]); };
  glossCands(phrase).forEach(t => add(t,true));
  add(r.text,false); r.alts.forEach(t => add(t,false));
  const box_=$("cands"); box_.innerHTML="";
  if(!list.length) return;
  const lb=document.createElement("span"); lb.className="lbl"; lb.textContent="言い換え候補（押すと置き換え）:"; box_.appendChild(lb);
  list.slice(0,12).forEach(([t,sd]) => {
    const b=document.createElement("button"); b.className="chip"+(sd?" sd":""); b.textContent=t;
    b.title=sd?"SD向け辞書":"Google翻訳の候補"; b.onclick=() => pickCand(t);
    box_.appendChild(b);
  });
}
function pickCand(text){
  const st=hl.R && hl.R.strong;
  if(!st || !map || !candSeg){ copyText(text); setStatus("「"+text+"」をコピーしました"); return; }
  const [x,y]=st, d=text.length-(y-x);
  box.R.setRangeText(text, x, y, "preserve");
  map.segs.forEach(g => { if(g===candSeg) g.R[1]+=d; else if(g.R[0]>=y){ g.R[0]+=d; g.R[1]+=d; } });
  hl.R.light[1]+=d; hl.R.strong=[x, x+text.length];
  count("R"); renderBoth(); setStatus("「"+text+"」に置き換えました");
}
apply();
